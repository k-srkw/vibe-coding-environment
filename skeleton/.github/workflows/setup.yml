name: Setup and Verify
on:
  push:
  workflow_dispatch:
jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Verify Setup
        run: bash scripts/verify-setup.sh
